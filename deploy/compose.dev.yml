name: work-tracker-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: work_tracker
      POSTGRES_USER: work_tracker
      POSTGRES_PASSWORD: work_tracker
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U work_tracker -d work_tracker']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
